<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>TaskFlow Dashboard</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #020617;
        color: white;
        font-family: Arial, sans-serif;
      }

      .container-main {
        display: flex;
        min-height: 100vh;
      }

      .sidebar {
        width: 260px;
        background: #111827;
        padding: 20px;
      }

      .sidebar h1 {
        color: #0ea5e9;
        margin-bottom: 40px;
      }

      .sidebar button {
        width: 100%;
        padding: 14px;
        margin-bottom: 15px;
        border: none;
        border-radius: 10px;
        background: #1e293b;
        color: white;
        cursor: pointer;
        text-align: left;
      }

      .sidebar button:hover {
        background: #0ea5e9;
      }

      .content {
        flex: 1;
        padding: 30px;
      }

      .card-box {
        background: #111827;
        padding: 25px;
        border-radius: 15px;
        margin-bottom: 25px;
      }

      input,
      textarea,
      select {
        width: 100%;
        padding: 14px;
        margin-bottom: 15px;
        border: none;
        border-radius: 10px;
        background: #1e293b;
        color: white;
      }

      button {
        border: none;
        padding: 12px 20px;
        border-radius: 10px;
        cursor: pointer;
      }

      .create-btn {
        width: 100%;
        background: linear-gradient(90deg, #2563eb, #7c3aed);
        color: white;
        font-weight: bold;
      }

      table {
        width: 100%;
        margin-top: 20px;
      }

      th,
      td {
        padding: 14px;
      }

      .done-btn {
        background: #16a34a;
        color: white;
        margin-right: 10px;
      }

      .delete-btn {
        background: #dc2626;
        color: white;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }

      .stat-card {
        background: #111827;
        padding: 20px;
        border-radius: 15px;
      }
    </style>
  </head>

  <body>
    <div class="container-main">
      <div class="sidebar">
        <h1>TaskFlow</h1>

        <button onclick="showSection('dashboard')">🏠 Dashboard</button>

        <button onclick="showSection('tasks')">📋 Tasks</button>

        <button onclick="showSection('analytics')">📊 Analytics</button>

        <button onclick="showSection('calendar')">📅 Calendar</button>

        <button style="background: #dc2626" onclick="logout()">Logout</button>
      </div>

      <div class="content">
        <div id="dashboardSection">
          <h1>Welcome Back 👋</h1>

          <br />

          <div class="stats">
            <div class="stat-card">
              <h3>Total Tasks</h3>
              <h1 id="totalTasks">0</h1>
            </div>

            <div class="stat-card">
              <h3>Completed</h3>
              <h1 id="completedTasks">0</h1>
            </div>

            <div class="stat-card">
              <h3>Pending</h3>
              <h1 id="pendingTasks">0</h1>
            </div>
          </div>

          <br />

          <div class="card-box">
            <h2>Create New Task</h2>

            <br />

            <form id="taskForm">
              <input type="text" id="title" placeholder="Task Title" required />

              <textarea
                id="description"
                placeholder="Task Description"
              ></textarea>

              <select id="priority">
                <option>Low</option>
                <option>Medium</option>
                <option>High</option>
              </select>

              <input type="date" id="dueDate" required />

              <button type="submit" class="create-btn">Create Task</button>
            </form>
          </div>
        </div>

        <div id="tasksSection" style="display: none">
          <div class="card-box">
            <button onclick="filterTasks('all')">All</button>

            <button onclick="filterTasks('Pending')">Pending</button>

            <button onclick="filterTasks('Completed')">Completed</button>

            <table>
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Status</th>
                  <th>Priority</th>
                  <th>Date</th>
                  <th>Action</th>
                </tr>
              </thead>

              <tbody id="taskTableBody"></tbody>
            </table>
          </div>
        </div>

        <div id="analyticsSection" style="display: none"></div>

        <div id="calendarSection" style="display: none">
          <div class="card-box">
            <h2>Calendar</h2>

            <br />

            <input
              type="date"
              id="calendarDate"
              onchange="showTasksForDate()"
            />

            <div id="calendarTasks"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      let allTasks = JSON.parse(localStorage.getItem("tasks")) || [];

      function saveTasks() {
        localStorage.setItem("tasks", JSON.stringify(allTasks));
      }

      function renderTasks(tasks) {
        const tableBody = document.getElementById("taskTableBody");

        tableBody.innerHTML = "";

        document.getElementById("totalTasks").innerText = tasks.length;

        const completed = tasks.filter(
          (task) => task.status === "Completed",
        ).length;

        const pending = tasks.filter(
          (task) => task.status === "Pending",
        ).length;

        document.getElementById("completedTasks").innerText = completed;

        document.getElementById("pendingTasks").innerText = pending;

        tasks.forEach((task, index) => {
          tableBody.innerHTML += `
<tr>

<td>${task.title}</td>

<td>${task.status}</td>

<td>${task.priority}</td>

<td>${task.dueDate}</td>

<td>

<button
class="done-btn"
onclick="toggleStatus(${index})"
>
Done
</button>

<button
class="delete-btn"
onclick="deleteTask(${index})"
>
Delete
</button>

</td>

</tr>
`;
        });
      }

      document.getElementById("taskForm").addEventListener("submit", (e) => {
        e.preventDefault();

        const title = document.getElementById("title").value;

        const description = document.getElementById("description").value;

        const dueDate = document.getElementById("dueDate").value;

        const priority = document.getElementById("priority").value;

        allTasks.push({
          title,
          description,
          dueDate,
          priority,
          status: "Pending",
        });

        saveTasks();

        renderTasks(allTasks);

        document.getElementById("taskForm").reset();
      });

      function deleteTask(index) {
        allTasks.splice(index, 1);

        saveTasks();

        renderTasks(allTasks);
      }

      function toggleStatus(index) {
        allTasks[index].status =
          allTasks[index].status === "Pending" ? "Completed" : "Pending";

        saveTasks();

        renderTasks(allTasks);
      }

      function filterTasks(status) {
        if (status === "all") {
          renderTasks(allTasks);
        } else {
          const filtered = allTasks.filter((task) => task.status === status);

          renderTasks(filtered);
        }
      }

      function updateAnalytics() {
        const total = allTasks.length;

        const completed = allTasks.filter(
          (task) => task.status === "Completed",
        ).length;

        const pending = allTasks.filter(
          (task) => task.status === "Pending",
        ).length;

        const completionRate =
          total > 0 ? Math.round((completed / total) * 100) : 0;

        document.getElementById("analyticsSection").innerHTML = `

<div class="card-box">

<h2>Analytics</h2>

<br>

<h3>Total Tasks: ${total}</h3>

<br>

<h3>Completed: ${completed}</h3>

<br>

<h3>Pending: ${pending}</h3>

<br>

<h3>Completion Rate: ${completionRate}%</h3>

</div>

`;
      }

      function showSection(section) {
        document.getElementById("dashboardSection").style.display =
          section === "dashboard" ? "block" : "none";

        document.getElementById("tasksSection").style.display =
          section === "tasks" ? "block" : "none";

        document.getElementById("analyticsSection").style.display =
          section === "analytics" ? "block" : "none";

        document.getElementById("calendarSection").style.display =
          section === "calendar" ? "block" : "none";

        if (section === "analytics") {
          updateAnalytics();
        }
      }

      function showTasksForDate() {
        const selectedDate = document.getElementById("calendarDate").value;

        const calendarTasks = document.getElementById("calendarTasks");

        const filtered = allTasks.filter(
          (task) => task.dueDate === selectedDate,
        );

        if (filtered.length === 0) {
          calendarTasks.innerHTML = "No tasks for this date";

          return;
        }

        let html = "";

        filtered.forEach((task) => {
          html += `
<div class="card-box">

<h3>${task.title}</h3>

<p>${task.description}</p>

</div>
`;
        });

        calendarTasks.innerHTML = html;
      }

      function logout() {
        window.location.href = "login.html";
      }

      renderTasks(allTasks);
    </script>
  </body>
</html>
